[package]
name = "sindricad"
version = "0.1.0"
description = "SindriCAD — a parametric CAD app driving build123d"
authors = ["MakerViking"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-only"

[lib]
name = "sindricad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# system-browser opener for TinkerAtlas links (capability-scoped to tinkeratlas.com).
tauri-plugin-opener = "2"
# One app instance only. Two instances each spawn a sidecar, and the second one
# cannot bind 127.0.0.1:8765, so it dies and the user is told the geometry engine
# crashed (field report 2c0cd78a, 0.1.84 on Windows).
tauri-plugin-single-instance = "2"
libc = "0.2"
hidapi = "2"
# portable CSPRNG for the sidecar WebSocket token (replaces a /dev/urandom read that
# fell back to a weak token on Windows).
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Printer device layer (printer.rs): LAN Moonraker HTTP client (plain HTTP).
# rustls-tls is for the TinkerAtlas layer (tinkeratlas.rs) — pure-Rust TLS with
# bundled webpki roots, so no system OpenSSL and cross-platform builds stay clean.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# cover screenshots cross Tauri IPC as base64 strings (a JSON Vec<u8> would be
# pathological at ~1 MB); tinkeratlas.rs decodes/encodes with this.
base64 = "0.22"
# explicit for the status-monitor task's sleep; tauri already runs the tokio rt.
# net/io-util: the one-shot loopback listener for browser sign-in (tinkeratlas.rs).
tokio = { version = "1", features = ["time", "net", "io-util"] }
# --- Rust/OCCT geometry spike (opt-in only) ---------------------------------
# These four crates are used ONLY by src-tauri/src/geom.rs (the experimental
# in-Rust OCCT geometry path, VITE_GEOM=rust). They are `optional` and behind the
# `rust-geom` feature (below) so the DEFAULT build links no system OpenCASCADE and
# needs no cmake — that is what makes the shell build cleanly on Windows/macOS/Linux.
# The shipping geometry runs in the Python sidecar. Enable the spike with
# `cargo build --features rust-geom` (needs OCCT >= 7.9 installed; Arch: `opencascade`).
opencascade = { path = "../third_party/opencascade-rs/crates/opencascade", default-features = false, optional = true }
opencascade-sys = { path = "../third_party/opencascade-rs/crates/opencascade-sys", default-features = false, optional = true }
# glam re-exported by opencascade for DVec3 used in the document->geometry mapping.
# MUST match the fork's glam (0.24) so DVec3 unifies across the crate boundary.
glam = { version = "0.24", optional = true }
# 3MF export for the Rust path: OCCT has no 3MF writer, so geom.rs tessellates the
# solid and writes the mesh as a 3MF via this crate. The SHIPPING colored-3MF export
# is done by the Python sidecar, so this is opt-in with the rest of the spike.
threemf = { version = "0.8", optional = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The `.sindri` container (container.rs): a ZIP holding document.json plus the
# geometry it references by content hash. Rust owns it, NOT the sidecar, because
# sidecar.rs deliberately does not auto-respawn — a dead sidecar is permanent for
# the session, and a save that needed it would leave the user unable to save at
# all. Saving is byte plumbing over files already on disk, so it needs no OCCT.
#
# `deflate-flate2`, NOT the `deflate` umbrella: that one also pulls
# `deflate-zopfli`, a much slower alternative compressor we have no use for and
# which would otherwise land in the DEFAULT build.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# flate2 is named EXPLICITLY, with its default `rust_backend`, and must stay that
# way. zip's `deflate-flate2` turns on the flate2 dependency but does NOT select
# a compression backend, so flate2 needs someone to enable one. This used to be
# left to tauri-plugin-updater, which pulls flate2 for its tar.gz path — true on
# Linux and macOS, FALSE on Windows, where the updater ships .exe/.msi and never
# touches tar.gz. The Windows build therefore got a backend-less flate2 and died
# with "No compression backend selected" plus an unresolved `crc32fast`, while
# Linux and macOS built clean. Pure Rust (miniz_oxide), so this pulls in no C
# zlib; feature unification is additive and cannot change updater behaviour.
flate2 = "1"
# content hashing for the container's blob ids. blake2b-128, matching the digest
# size the sidecar already uses for its own keys.
blake2 = "0.10"

[features]
# Off by default: the default build has zero OCCT/cmake dependency. Turn on to
# compile the in-Rust OCCT geometry path (src/geom.rs) for VITE_GEOM=rust.
rust-geom = ["dep:opencascade", "dep:opencascade-sys", "dep:glam", "dep:threemf"]

# Windows-only: a Job Object with KILL_ON_JOB_CLOSE reaps the sidecar (and its
# ProcessPoolExecutor workers) when the app exits or crashes. Unix uses a process
# group + PR_SET_PDEATHSIG instead (no extra dep).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
