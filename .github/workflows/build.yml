# Cross-platform build + bundle for SindriCAD (Tauri 2 + bundled Python sidecar).
#
# No system OpenCASCADE anywhere: the Rust/OCCT path is behind the off-by-default
# `rust-geom` feature (see src-tauri/Cargo.toml), and the shipping geometry runs in the
# Python sidecar, whose cadquery-ocp-novtk wheels bundle their own OCCT. So this
# workflow has NO "build OCCT from source / brew / vcpkg" steps (they were removed when
# Move 1 gated OCCT out).
#
# Per OS it: builds a relocatable Python "sidecar-runtime" (uv + python-build-standalone
# installed from sidecar/uv.lock), then runs `tauri build` with the bundle-only config
# that ships that runtime as a resource, and uploads the installers.
#
# Scope: x86_64 Linux, Apple Silicon macOS, x86_64 Windows. (No Intel-mac / linux-arm64.)

name: build

on:
  push:
    branches: [main, sindricad]
  pull_request:
  workflow_dispatch:

jobs:
  # Gates the build matrix: sidecar tests, Rust unit tests, and the (new) vitest
  # frontend tests all run BEFORE any installer is built. Runs once on Linux only —
  # the build matrix below still builds/bundles on all three platforms regardless.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Cheapest gate first: refuse agent/editor session artifacts and hardcoded
      # developer paths before spending 18 minutes on installers. This is a public
      # repo — .claude/settings.json and a home-directory layout both reached it
      # once already, and .gitignore can't catch an already-tracked path.
      - name: Repo hygiene
        run: sh scripts/check-repo-hygiene.sh

      # Same system deps as the build job's Linux leg: `cargo test --lib` links the
      # tauri crate, which needs the webkit2gtk stack + libudev (Rust device APIs).
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (vitest)
        run: npx vitest run

      - name: Install Python 3.12 + sync sidecar deps (locked)
        run: |
          uv python install 3.12
          cd sidecar && uv sync

      # The sidecar test files are `__main__` scripts, NOT pytest-discoverable
      # (`pytest sidecar/` silently collects 0 tests — see docs/IMPROVEMENT-AUDIT.md
      # §5.1) — so run each directly with the synced venv's interpreter.
      # Keep this list complete: five of these (texture, checkpoint, projected,
      # val_guard, body_binding) existed for weeks without ever running in CI.
      - name: Sidecar tests (direct __main__ invocation, not pytest)
        working-directory: sidecar
        run: |
          uv run python test_smoke.py
          uv run python test_geomstore.py
          uv run python test_selector_v2.py
          uv run python test_ws.py
          uv run python test_pool_init.py
          uv run python test_texture.py
          uv run python test_checkpoint.py
          uv run python test_projected.py
          uv run python test_val_guard.py
          uv run python test_body_binding.py
          uv run python test_selector_ambiguity.py
          uv run python test_assembly.py
          uv run python test_cancel.py

      # Geometry eval harnesses (fillet corpus, selector survival, real-server op
      # coverage). They are measurement oracles that always exit 0, so the script
      # supplies the thresholds. ~1 minute. Nothing ran these before, which is how
      # op coverage decayed 28/34 -> 23/34 unnoticed.
      - name: Geometry evals (thresholded)
        run: sh scripts/check-geometry-evals.sh

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

  build:
    needs: test
    permissions:
      contents: write # tauri-action may attach artifacts to a draft release
    strategy:
      fail-fast: false # one OS failing must not hide the others' status
      matrix:
        include:
          # ubuntu-22.04: webkit2gtk-4.1 + a lower glibc, so the AppImage/.deb runs
          # on more systems than a -24.04 build would.
          - platform: ubuntu-22.04
          - platform: macos-14 # Apple Silicon (arm64) runner
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        # third_party/opencascade-rs is vendored in-repo (no submodules), and the
        # default build never compiles it, so a plain checkout is enough.

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: npm ci

      # --- the bundled Python geometry runtime (relocatable, novtk, from the lock) ---
      - name: Build sidecar runtime (Linux/macOS)
        if: matrix.platform != 'windows-latest'
        run: bash scripts/build-sidecar-runtime.sh

      - name: Build sidecar runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-sidecar-runtime.ps1

      # linuxdeploy resolves every ELF's dependencies by soname lookup, which can't
      # see the runtime's manylinux-vendored dirs (scipy.libs etc. reference their
      # mangled sonames via $ORIGIN rpaths). First AppImage run died on exactly that:
      # "Could not find dependency: libquadmath-2284e583.so.0.0.0". Put every runtime
      # dir holding a real shared library (lib*.so*, not python extension modules)
      # on LD_LIBRARY_PATH so dependency deployment can find the vendored names.
      - name: Expose vendored sidecar libs to linuxdeploy (AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          dirs=$(find "$PWD/src-tauri/sidecar-runtime" -name 'lib*.so*' -printf '%h\n' | sort -u | paste -sd: -)
          echo "LD_LIBRARY_PATH=$dirs" >> "$GITHUB_ENV"
          echo "vendored lib dirs:"; echo "$dirs" | tr ':' '\n'

      # Rolling-beta versioning: the updater compares semver, and every build being
      # 0.1.0 would mean "never an update". CI builds get 0.1.<run_number>; local
      # dev builds stay at the checked-in 0.1.0.
      - name: Stamp rolling version
        shell: bash
        run: |
          v="0.1.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='$v';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "stamped $v"

      # Dependabot-triggered runs get NO repository secrets, by GitHub's design -- so
      # TAURI_SIGNING_PRIVATE_KEY arrives empty and `tauri build` aborts with "failed
      # to decode secret key: Missing comment in secret key". That failed the build leg
      # on all three OSes for every dependency PR while the `test` gate passed, which
      # reads as "the bump broke the build" when nothing was wrong with the bump.
      #
      # Bundle WITHOUT updater artifacts in that case. The point of building a
      # dependency PR is to prove the bundle still assembles on all three OSes, not to
      # ship it. Deliberately NOT solved by giving Dependabot the signing key: that key
      # authorises pushing an update to every tester's machine, and a Dependabot run
      # executes the install scripts of the very package it just bumped.
      #
      # On a normal push the key is present, this is a no-op, and updater artifacts stay
      # signed -- the in-app updater and the `release` job's latest.json depend on that.
      - name: Disable updater artifacts when there is no signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signing key present -- updater artifacts stay enabled"
            exit 0
          fi
          echo "::warning::No updater signing key (expected on Dependabot PRs) -- bundling WITHOUT updater artifacts; this build is not shippable."
          node -e "const fs=require('fs');const f='src-tauri/tauri.bundle.conf.json';const j=JSON.parse(fs.readFileSync(f));j.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      # --- build + bundle. The bundle-only config ships sidecar-runtime/ as a resource
      #     and (on macOS) turns on hardened runtime + entitlements. ---
      - name: Build + bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In-app updater: updater bundles are minisign-signed with this key
          # (createUpdaterArtifacts in the bundle overlay config). Separate from OS
          # code signing, which stays deferred below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # linuxdeploy's strip pass chokes on the bundled sidecar runtime's
          # OCCT/CPython shared objects (AppImage leg: "failed to run linuxdeploy").
          # NO_STRIP is linuxdeploy's own escape hatch; harmless on the other OSes.
          NO_STRIP: true
          # UNSIGNED builds for now (Apple Developer Program deferred — no budget).
          # macOS ships unsigned, which current Gatekeeper reports as "the app is
          # damaged and can't be opened" — right-click -> Open is NOT enough for an
          # app with no signature at all, and saying so in the README and release
          # notes is what sent the reporter of #5 to the issue tracker. The command
          # that works is `xattr -dr com.apple.quarantine /Applications/SindriCAD.app`.
          # Windows unsigned runs with a SmartScreen warning. To SIGN later: add the
          # APPLE_* / Windows signing secrets back here AND append the signing config:
          #   args: --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.macos-sign.conf.json
        with:
          # bundle-only config ships sidecar-runtime/ as a resource. (No macOS signing
          # block here, so tauri produces an unsigned .app without attempting codesign.)
          # --verbose so bundler sub-tool failures (linuxdeploy) show their real output.
          args: --verbose --config src-tauri/tauri.bundle.conf.json

      # KNOWN FOLLOW-UP (macOS notarization): notarization is NOT recursive, so every
      # embedded Mach-O under sidecar-runtime (libpython + the cadquery-ocp .dylibs)
      # must be signed with the hardened runtime. If notarization fails on the first
      # signed mac run, add a recursive `codesign --force --options runtime --sign
      # "$APPLE_SIGNING_IDENTITY"` pass over src-tauri/sidecar-runtime BEFORE this step.
      # Windows Authenticode: set bundle.windows.signCommand in the bundle config +
      # a signing secret to clear SmartScreen (optional; unsigned still runs).

      # The AppImage must NOT carry the GTK/WebKit/GStreamer stack. Tauri's AppImage
      # bundler copies webkit2gtk in explicitly and linuxdeploy pulls the rest of the GTK
      # stack in behind it, and that bundled stack aborts its own web process at startup
      # on any host running a modern WebKit: the window opens, the page never loads, and
      # before the load watchdog there was nothing in the log at all. Reported on NixOS
      # with WebKitGTK 2.50.4 (#3), reproduced on Arch with 2.52.5.
      #
      # It is not version skew. A 24.04-built bundle fails identically (PR #8), the
      # bundle is internally consistent (LD_DEBUG shows GTK/GLib/WebKit all resolving to
      # it), and the environment is not at fault either (the .deb binary runs fine under
      # the full set of variables the AppImage's GTK hook exports). What fails is that
      # bundled stack meeting the host's GPU drivers, which are never bundled and cannot
      # be. Removing the bundled stack outright is what fixes it, and it is the
      # configuration the .deb has shipped all along.
      #
      # Measured: with all 233 bundled system libraries removed, the AppImage starts and
      # leaves no coredump on a host where the shipped one does neither.
      #
      # usr/lib/SindriCAD holds the Python geometry engine and MUST survive: it is the
      # app, not a system library, and no host provides it.
      - name: Un-bundle the system stack from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          img=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          [ -n "$img" ] || { echo "::error::no AppImage was produced"; exit 1; }
          echo "before: $(du -m "$img" | cut -f1) MB"

          work=$(mktemp -d)
          cp "$img" "$work/in.AppImage"
          (cd "$work" && ./in.AppImage --appimage-extract >/dev/null)
          root="$work/squashfs-root"

          find "$root/usr/lib" -maxdepth 1 -type f -name '*.so*' -delete
          rm -rf "$root/usr/lib/x86_64-linux-gnu"
          # the geometry engine must still be there, or we just shipped a dead app
          test -d "$root/usr/lib/SindriCAD/sidecar-runtime"

          wget -qO "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/appimagetool"
          ARCH=x86_64 "$work/appimagetool" --appimage-extract-and-run "$root" "$img"
          echo "after: $(du -m "$img" | cut -f1) MB"

          # The old .sig covers the old bytes. Leaving it would hand every existing
          # install an update whose signature does not verify.
          rm -f "$img.sig"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx --yes @tauri-apps/cli signer sign "$img"
            test -f "$img.sig"
          else
            echo "::warning::no signing key, AppImage left unsigned (not shippable)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sindricad-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

  # Rolling "beta" pre-release: every green main build replaces the installers on
  # the releases/tag/beta page, so the download link in the README is stable and
  # needs no GitHub login (Actions artifacts do). The release is deleted and
  # recreated each time: asset names carry the stamped version, so updating in
  # place would accumulate stale installers. latest.json feeds the in-app updater
  # (tauri-plugin-updater): per-platform updater-bundle URL + minisign signature.
  # Job-level concurrency serializes racing main pushes.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-beta
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Must come BEFORE download-artifact: actions/checkout cleans the workspace
      # by default and would delete dist/. Sparse, because the only thing this job
      # needs out of the repo is the changelog it builds release notes from.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          v="0.1.${{ github.run_number }}"
          base="https://github.com/${{ github.repository }}/releases/download/beta"
          d="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "$v" --arg d "$d" '{version:$v, pub_date:$d, platforms:{}}' > latest.json
          add() { # $1 = updater platform key, $2 = updater bundle path
            [ -n "$2" ] && [ -f "$2" ] || { echo "NOTE: no bundle for $1"; return 0; }
            sig="$2.sig"
            [ -f "$sig" ] || { echo "WARNING: $2 has no .sig — $1 left out of latest.json"; return 0; }
            jq --arg k "$1" --arg u "$base/$(basename "$2")" --rawfile s "$sig" \
              '.platforms[$k] = {signature: $s, url: $u}' latest.json > t && mv t latest.json
          }
          add linux-x86_64  "$(find dist -name '*.AppImage'   | head -1)"
          add windows-x86_64 "$(find dist -name '*setup.exe'  | head -1)"
          add darwin-aarch64 "$(find dist -name '*.app.tar.gz' | head -1)"  # macos-14 runners are arm64
          cat latest.json

      - name: Publish rolling beta release
        shell: bash
        run: |
          set -euo pipefail
          # No spaces in Tauri bundle filenames, so plain word-splitting is safe here.
          files=$(find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*setup.exe' \
            -o -name '*.app.tar.gz' -o -name '*.sig' \))
          gh release delete beta --repo ${{ github.repository }} --cleanup-tag --yes || true

          # Release notes: boilerplate, plus a section of CHANGELOG.md (every line
          # after a "## " heading, up to the next one). "### " subheads survive
          # because the pattern requires a space in the third column.
          #
          # Normally that is section 1, the open "## Unreleased". When it is EMPTY
          # we fall back to section 2, the newest named version. That case is a
          # release that was just cut: the cut is its own commit, so the build
          # carrying it would otherwise find nothing to say and replace a release
          # that HAD notes with one that has none, on a tag that is deleted and
          # recreated every build. The heading below stays generic either way, so
          # the notes never claim a version number the binary does not carry.
          printf 'Rolling beta 0.1.%s, rebuilt automatically from the latest `main` (commit %s).\n' \
            '${{ github.run_number }}' '${{ github.sha }}' > notes.md
          if [ -f CHANGELOG.md ]; then
            section() { awk -v want="$1" '/^## /{n++} n==want && !/^## /' CHANGELOG.md | sed -e '/./,$!d'; }
            section 1 > changes.md
            if [ ! -s changes.md ]; then
              echo "NOTE: Unreleased is empty (a release was just cut) — using the newest named section"
              section 2 > changes.md
            fi
            if [ -s changes.md ]; then
              printf '\n## Changes in this build\n\n' >> notes.md
              cat changes.md >> notes.md
            fi
          else
            echo "WARNING: no CHANGELOG.md, publishing boilerplate notes only"
          fi
          printf '\n---\n\nThe builds are unsigned for now: Windows shows a SmartScreen warning ("More info", then "Run anyway"); on macOS Gatekeeper may report the app as damaged, which it is not, and `xattr -dr com.apple.quarantine /Applications/SindriCAD.app` clears it. Install notes are in the [README](https://github.com/%s#install). Installed apps update themselves from this release.\n' \
            '${{ github.repository }}' >> notes.md
          cat notes.md

          gh release create beta --repo ${{ github.repository }} \
            --prerelease --target ${{ github.sha }} \
            --title "SindriCAD beta (rolling)" \
            --notes-file notes.md \
            $files latest.json

  # docs/IMPROVEMENT-AUDIT.md §5.4: the opt-in `rust-geom` feature (src-tauri/src/geom.rs,
  # 2320 lines / 67 unwrap-or-expect calls) is never compiled by the `build` job above
  # (default build is OCCT-free by design — see the Cargo.toml comment on the feature),
  # so it can silently bit-rot. This job is a manual, non-gating bit-rot check: it does
  # NOT run on push/PR and nothing `needs:` it.
  #
  # ubuntu-22.04's package repos top out around OCCT 7.6, but opencascade-sys (the
  # vendored third_party/opencascade-rs fork) requires OCCT >= 7.9, which isn't
  # available as a hosted-runner apt package — so this step is EXPECTED TO FAIL on
  # today's runners until either a newer runner image ships OCCT >= 7.9, or a step is
  # added here to build OCCT >= 7.9 from source (slow; deliberately not done today).
  # Trigger to revisit: when a runner image with OCCT 7.9 exists, or when rust-geom
  # gets promoted off the experimental-spike path.
  # Browser end-to-end checks for the imported-assembly Browser tree.
  #
  # Deliberately NON-GATING: nothing `needs:` this job, exactly like
  # rust-geom-check below, so a browser flake can never block a beta publish.
  # That matters here because a green `build` auto-publishes to users who
  # auto-update, and browser e2e is the classic flaky surface.
  #
  # These exist because everything else about the assembly tree is unit tests and
  # row counts. The render-signature bug (a document whose product NAMES changed
  # while its bodies did not never repainted the panel) passed every unit test and
  # was only caught by looking at the rendered panel.
  #
  # Uses the runner's PREINSTALLED Google Chrome rather than downloading a browser,
  # and installs playwright-core with --no-save so the main build path keeps its
  # dependency set unchanged.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: |
          npm ci
          npm i --no-save playwright-core@1.56.0

      - name: Install Python 3.12 + sync sidecar deps (locked)
        run: |
          uv python install 3.12
          cd sidecar && uv sync

      - name: Start the geometry sidecar and vite
        run: |
          cd sidecar && SINDRI_SIDECAR_PORT=8765 SINDRI_SIDECAR_TOKEN=citoken \
            uv run python server.py > /tmp/ci_sidecar.log 2>&1 &
          cd "$GITHUB_WORKSPACE" && npx vite --port 5173 > /tmp/ci_vite.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "LISTENING 8765" /tmp/ci_sidecar.log 2>/dev/null && break
            sleep 2
          done
          grep -q "LISTENING 8765" /tmp/ci_sidecar.log || { echo "sidecar never listened"; cat /tmp/ci_sidecar.log; exit 1; }

      # e2e/browser_tree_perf.cjs is deliberately NOT run here: it is a
      # benchmark whose verdict compares two medians, and a shared runner's
      # noise can invert that. Run it by hand (see its header).
      - name: Assembly tree end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/assembly_tree_e2e.cjs

      - name: Sidecar log on failure
        if: failure()
        run: tail -50 /tmp/ci_sidecar.log /tmp/ci_vite.log || true

  rust-geom-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check --features rust-geom (expected to fail without OCCT >= 7.9)
        working-directory: src-tauri
        run: cargo check --features rust-geom
