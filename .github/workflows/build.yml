# Cross-platform build + bundle for SindriCAD (Tauri 2 + bundled Python sidecar).
#
# No system OpenCASCADE anywhere: the Rust/OCCT path is behind the off-by-default
# `rust-geom` feature (see src-tauri/Cargo.toml), and the shipping geometry runs in the
# Python sidecar, whose cadquery-ocp-novtk wheels bundle their own OCCT. So this
# workflow has NO "build OCCT from source / brew / vcpkg" steps (they were removed when
# Move 1 gated OCCT out).
#
# Per OS it: builds a relocatable Python "sidecar-runtime" (uv + python-build-standalone
# installed from sidecar/uv.lock), then runs `tauri build` with the bundle-only config
# that ships that runtime as a resource, and uploads the installers.
#
# Scope: x86_64 Linux, Apple Silicon macOS, x86_64 Windows. (No Intel-mac / linux-arm64.)

name: build

on:
  push:
    branches: [main, sindricad]
  pull_request:
  workflow_dispatch:

# Serialise per ref, so two pushes to `main` cannot both reach `release` and race
# for the rolling `beta` tag. The rolling tag is deleted and recreated on every
# release, so the LAST upload wins regardless of which commit it came from: two
# overlapping runs meant a build from the OLDER commit could replace the newer
# one's assets. On 2026-08-08 a fast-forward merge and a PR merge landed 20
# seconds apart and the superseded run had to be cancelled by hand to prevent it.
#
# Runs QUEUE rather than cancel, deliberately. Cancelling a run already inside
# `release` would interrupt it partway through replacing the assets and leave the
# tag holding a half-updated set, which is a worse failure than the race. Queued,
# the older run finishes cleanly and the newer one overwrites it in full, so the
# published state always ends up being the newest commit's build.
#
# That is also why `cancel-in-progress` is not conditional. Cancelling superseded
# PR runs would save runner time, but it needs an expression, and an expression
# here would apply to `main` too unless it is exactly right. Queueing everywhere
# is the boring choice that cannot corrupt a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gates the build matrix: sidecar tests, Rust unit tests, and the (new) vitest
  # frontend tests all run BEFORE any installer is built. Runs once on Linux only —
  # the build matrix below still builds/bundles on all three platforms regardless.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Cheapest gate first: refuse agent/editor session artifacts and hardcoded
      # developer paths before spending 18 minutes on installers. This is a public
      # repo — .claude/settings.json and a home-directory layout both reached it
      # once already, and .gitignore can't catch an already-tracked path.
      - name: Repo hygiene
        run: sh scripts/check-repo-hygiene.sh

      # Same system deps as the build job's Linux leg: `cargo test --lib` links the
      # tauri crate, which needs the webkit2gtk stack + libudev (Rust device APIs).
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (vitest)
        run: npx vitest run

      - name: Install Python 3.12 + sync sidecar deps (locked)
        run: |
          uv python install 3.12
          cd sidecar && uv sync

      # The sidecar test files are `__main__` scripts, NOT pytest-discoverable
      # (`pytest sidecar/` silently collects 0 tests — see docs/IMPROVEMENT-AUDIT.md
      # §5.1) — so run each directly with the synced venv's interpreter.
      # Keep this list complete: five of these (texture, checkpoint, projected,
      # val_guard, body_binding) existed for weeks without ever running in CI.
      - name: Sidecar tests (direct __main__ invocation, not pytest)
        working-directory: sidecar
        run: |
          uv run python test_smoke.py
          uv run python test_geomstore.py
          uv run python test_selector_v2.py
          uv run python test_ws.py
          uv run python test_pool_init.py
          uv run python test_texture.py
          uv run python test_checkpoint.py
          uv run python test_projected.py
          uv run python test_val_guard.py
          uv run python test_body_binding.py
          uv run python test_selector_ambiguity.py
          uv run python test_error_codes.py
          # Field report 88042d97: a degenerate line/arc/spline must name and
          # locate itself instead of reaching the user as a raw OCCT class. It
          # also pins the kernel's own thresholds, so an OCCT or build123d bump
          # that moves one fails here rather than silently mis-tuning the guard.
          uv run python test_degenerate_entities.py
          # Ratchet, not cases: it enumerates the ops server.py dispatches and
          # sends each one every malformed shape it derives from the request
          # fields server.py reads. An op added without a _REQUIRED_FIELDS row
          # fails here the day it lands, so this line has to stay — an unlisted
          # file is invisible to CI, which is how five suites sat inert for
          # weeks (see below).
          uv run python test_malformed_ops.py
          uv run python test_untrusted.py
          uv run python test_mass_properties.py
          uv run python test_query_op.py
          uv run python test_assembly.py
          uv run python test_cancel.py
          uv run python test_blobstore.py
          uv run python test_import_blob.py
          uv run python test_blob_rebuild.py
          uv run python test_heartbeat.py
          uv run python test_sysmem.py
          uv run python test_export_gates.py
          uv run python test_canonicalize.py
          # These six existed and PASSED for weeks without ever running here —
          # the same gap that had left texture/checkpoint/projected/val_guard/
          # body_binding inert. Inert regression protection reads as coverage
          # while protecting nothing. test_text.py is the ONLY thing covering
          # the list_fonts / tessellate_text paths at any layer.
          uv run python test_glb.py
          uv run python test_project_op.py
          uv run python test_project_cache.py
          uv run python test_refresh.py
          uv run python test_silhouette.py
          uv run python test_text.py
          uv run python test_texture_cells.py
          # test_text_on_face.py consumes resolve_faces, so the selector work
          # lands directly on it — and it had never been listed here, which is
          # the same "inert regression protection" hole as the five below.
          uv run python test_text_on_face.py
          # Was never in CI and was quietly rotting: it is the only suite that
          # drives ops over the real socket end to end, including the v4 -> v5
          # geometry migration.
          uv run python test_fullstack.py
          # The sealed-void backstop (GH #52). Its subject is a cut that produces
          # a WRONG-BUT-GREEN body, so no error-count assertion anywhere else can
          # see it — and volume can't either (that suite asserts the two
          # documents are volume-identical). Unlisted, it would be inert.
          uv run python test_sealed_void.py
          # Face-anchored sketch/datum planes (GH #52), beside the backstop above.
          # Same reason it has to be listed: its oracles are SHELL COUNT and
          # CENTRE OF MASS, and it asserts on purpose that the three documents it
          # builds are volume-identical — so nothing else in this list can fail
          # when this one breaks.
          uv run python test_sketch_on_face.py
          # GH #49: a fitted cylinder face is wrapped in a trimmed surface, so
          # build123d's Face.radius reads None and every radius-aware selector
          # path silently skipped it. Its fixture is hand-built OCCT (the shape
          # the mesh fitter emits), which no document-level suite can produce, so
          # unlisted it would be inert.
          uv run python test_face_radius.py
          # GH #49: surface fitting on mesh import. Its oracle is the SURFACE-TYPE
          # CENSUS and the direct-modelling ops — the faceted import it replaces is
          # already valid, watertight, one solid and within 0.02% on volume, so
          # every other suite in this list stays green when fitting breaks.
          uv run python test_surface_fit.py
          # Two sketch shapes drawing the SAME edge (a square flush in a
          # rectangle's corner) must both own it, or the corner area loses its
          # name and the extrude drifts onto a neighbour (field report d7659f36).
          uv run python test_region_coincident_entities.py

      # Geometry eval harnesses (fillet corpus, selector survival, real-server op
      # coverage). They are measurement oracles that always exit 0, so the script
      # supplies the thresholds. ~1 minute. Nothing ran these before, which is how
      # op coverage decayed 28/34 -> 23/34 unnoticed.
      - name: Geometry evals (thresholded)
        run: sh scripts/check-geometry-evals.sh

      # --tests, not --lib: tests/container_seam.rs drives a real STEP import
      # through the sidecar, packages it with the Rust container writer, extracts
      # it somewhere fresh and rebuilds from it. Nothing else proves the two
      # halves of that seam compose. It needs sidecar/.venv, which the `uv sync`
      # step above created.
      - name: Rust tests (unit + cross-language seam)
        working-directory: src-tauri
        run: cargo test --tests

  build:
    needs: test
    permissions:
      contents: write # tauri-action may attach artifacts to a draft release
    strategy:
      fail-fast: false # one OS failing must not hide the others' status
      matrix:
        include:
          # ubuntu-22.04: webkit2gtk-4.1 + a lower glibc, so the AppImage/.deb runs
          # on more systems than a -24.04 build would.
          - platform: ubuntu-22.04
          - platform: macos-14 # Apple Silicon (arm64) runner
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        # third_party/opencascade-rs is vendored in-repo (no submodules), and the
        # default build never compiles it, so a plain checkout is enough.

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: npm ci

      # --- the bundled Python geometry runtime (relocatable, novtk, from the lock) ---
      - name: Build sidecar runtime (Linux/macOS)
        if: matrix.platform != 'windows-latest'
        run: bash scripts/build-sidecar-runtime.sh

      - name: Build sidecar runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-sidecar-runtime.ps1

      # linuxdeploy resolves every ELF's dependencies by soname lookup, which can't
      # see the runtime's manylinux-vendored dirs (scipy.libs etc. reference their
      # mangled sonames via $ORIGIN rpaths). First AppImage run died on exactly that:
      # "Could not find dependency: libquadmath-2284e583.so.0.0.0". Put every runtime
      # dir holding a real shared library (lib*.so*, not python extension modules)
      # on LD_LIBRARY_PATH so dependency deployment can find the vendored names.
      - name: Expose vendored sidecar libs to linuxdeploy (AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          dirs=$(find "$PWD/src-tauri/sidecar-runtime" -name 'lib*.so*' -printf '%h\n' | sort -u | paste -sd: -)
          echo "LD_LIBRARY_PATH=$dirs" >> "$GITHUB_ENV"
          echo "vendored lib dirs:"; echo "$dirs" | tr ':' '\n'

      # Rolling-beta versioning: the updater compares semver, and every build being
      # 0.1.0 would mean "never an update". CI builds get 0.1.<run_number>; local
      # dev builds stay at the checked-in 0.1.0.
      - name: Stamp rolling version
        shell: bash
        run: |
          v="0.1.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='$v';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "stamped $v"

      # Dependabot-triggered runs get NO repository secrets, by GitHub's design -- so
      # TAURI_SIGNING_PRIVATE_KEY arrives empty and `tauri build` aborts with "failed
      # to decode secret key: Missing comment in secret key". That failed the build leg
      # on all three OSes for every dependency PR while the `test` gate passed, which
      # reads as "the bump broke the build" when nothing was wrong with the bump.
      #
      # Bundle WITHOUT updater artifacts in that case. The point of building a
      # dependency PR is to prove the bundle still assembles on all three OSes, not to
      # ship it. Deliberately NOT solved by giving Dependabot the signing key: that key
      # authorises pushing an update to every tester's machine, and a Dependabot run
      # executes the install scripts of the very package it just bumped.
      #
      # On a normal push the key is present, this is a no-op, and updater artifacts stay
      # signed -- the in-app updater and the `release` job's latest.json depend on that.
      - name: Disable updater artifacts when there is no signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signing key present -- updater artifacts stay enabled"
            exit 0
          fi
          echo "::warning::No updater signing key (expected on Dependabot PRs) -- bundling WITHOUT updater artifacts; this build is not shippable."
          node -e "const fs=require('fs');const f='src-tauri/tauri.bundle.conf.json';const j=JSON.parse(fs.readFileSync(f));j.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      # --- build + bundle. The bundle-only config ships sidecar-runtime/ as a resource
      #     and (on macOS) turns on hardened runtime + entitlements. ---
      - name: Build + bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In-app updater: updater bundles are minisign-signed with this key
          # (createUpdaterArtifacts in the bundle overlay config). Separate from OS
          # code signing, which stays deferred below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # linuxdeploy's strip pass chokes on the bundled sidecar runtime's
          # OCCT/CPython shared objects (AppImage leg: "failed to run linuxdeploy").
          # NO_STRIP is linuxdeploy's own escape hatch; harmless on the other OSes.
          NO_STRIP: true
          # UNSIGNED builds for now (Apple Developer Program deferred — no budget).
          # macOS ships unsigned, which current Gatekeeper reports as "the app is
          # damaged and can't be opened" — right-click -> Open is NOT enough for an
          # app with no signature at all, and saying so in the README and release
          # notes is what sent the reporter of #5 to the issue tracker. The command
          # that works is `xattr -dr com.apple.quarantine /Applications/SindriCAD.app`.
          # Windows unsigned runs with a SmartScreen warning. To SIGN later: add the
          # APPLE_* / Windows signing secrets back here AND append the signing config:
          #   args: --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.macos-sign.conf.json
        with:
          # bundle-only config ships sidecar-runtime/ as a resource. (No macOS signing
          # block here, so tauri produces an unsigned .app without attempting codesign.)
          # --verbose so bundler sub-tool failures (linuxdeploy) show their real output.
          args: --verbose --config src-tauri/tauri.bundle.conf.json

      # KNOWN FOLLOW-UP (macOS notarization): notarization is NOT recursive, so every
      # embedded Mach-O under sidecar-runtime (libpython + the cadquery-ocp .dylibs)
      # must be signed with the hardened runtime. If notarization fails on the first
      # signed mac run, add a recursive `codesign --force --options runtime --sign
      # "$APPLE_SIGNING_IDENTITY"` pass over src-tauri/sidecar-runtime BEFORE this step.
      # Windows Authenticode: set bundle.windows.signCommand in the bundle config +
      # a signing secret to clear SmartScreen (optional; unsigned still runs).

      # The AppImage must NOT carry the GTK/WebKit/GStreamer stack. Tauri's AppImage
      # bundler copies webkit2gtk in explicitly and linuxdeploy pulls the rest of the GTK
      # stack in behind it, and that bundled stack aborts its own web process at startup
      # on any host running a modern WebKit: the window opens, the page never loads, and
      # before the load watchdog there was nothing in the log at all. Reported on NixOS
      # with WebKitGTK 2.50.4 (#3), reproduced on Arch with 2.52.5.
      #
      # It is not version skew. A 24.04-built bundle fails identically (PR #8), the
      # bundle is internally consistent (LD_DEBUG shows GTK/GLib/WebKit all resolving to
      # it), and the environment is not at fault either (the .deb binary runs fine under
      # the full set of variables the AppImage's GTK hook exports). What fails is that
      # bundled stack meeting the host's GPU drivers, which are never bundled and cannot
      # be. Removing the bundled stack outright is what fixes it, and it is the
      # configuration the .deb has shipped all along.
      #
      # Measured: with all 233 bundled system libraries removed, the AppImage starts and
      # leaves no coredump on a host where the shipped one does neither.
      #
      # usr/lib/SindriCAD holds the Python geometry engine and MUST survive: it is the
      # app, not a system library, and no host provides it.
      - name: Un-bundle the system stack from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          img=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          [ -n "$img" ] || { echo "::error::no AppImage was produced"; exit 1; }
          echo "before: $(du -m "$img" | cut -f1) MB"

          work=$(mktemp -d)
          cp "$img" "$work/in.AppImage"
          (cd "$work" && ./in.AppImage --appimage-extract >/dev/null)
          root="$work/squashfs-root"

          find "$root/usr/lib" -maxdepth 1 -type f -name '*.so*' -delete
          rm -rf "$root/usr/lib/x86_64-linux-gnu"
          # the geometry engine must still be there, or we just shipped a dead app
          test -d "$root/usr/lib/SindriCAD/sidecar-runtime"

          # tauri-bundler before 2.11.4 wrote .DirIcon as an ABSOLUTE symlink into
          # the runner's build directory, so it dangled everywhere else and
          # AppImage installers refused to install (issue #13, upstream #15596).
          # `test -e` follows the link, so this fails on a dangling target rather
          # than shipping a broken icon again. Do NOT "fix" a failure here by
          # rewriting the link — that hides a bundler regression.
          echo ".DirIcon -> $(readlink "$root/.DirIcon" || echo '(not a symlink)')"
          test -e "$root/.DirIcon"

          wget -qO "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/appimagetool"
          ARCH=x86_64 "$work/appimagetool" --appimage-extract-and-run "$root" "$img"
          echo "after: $(du -m "$img" | cut -f1) MB"

          # The old .sig covers the old bytes. Leaving it would hand every existing
          # install an update whose signature does not verify.
          rm -f "$img.sig"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx --yes @tauri-apps/cli signer sign "$img"
            test -f "$img.sig"
          else
            echo "::warning::no signing key, AppImage left unsigned (not shippable)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sindricad-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

  # Rolling "beta" pre-release: every green main build replaces the installers on
  # the releases/tag/beta page, so the download link in the README is stable and
  # needs no GitHub login (Actions artifacts do). The release is deleted and
  # recreated each time: asset names carry the stamped version, so updating in
  # place would accumulate stale installers. latest.json feeds the in-app updater
  # (tauri-plugin-updater): per-platform updater-bundle URL + minisign signature.
  # Job-level concurrency serializes racing main pushes.
  release:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-beta
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Must come BEFORE download-artifact: actions/checkout cleans the workspace
      # by default and would delete dist/. Sparse, because the only thing this job
      # needs out of the repo is the changelog it builds release notes from.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          v="0.1.${{ github.run_number }}"
          base="https://github.com/${{ github.repository }}/releases/download/beta"
          d="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "$v" --arg d "$d" '{version:$v, pub_date:$d, platforms:{}}' > latest.json
          add() { # $1 = updater platform key, $2 = updater bundle path
            [ -n "$2" ] && [ -f "$2" ] || { echo "NOTE: no bundle for $1"; return 0; }
            sig="$2.sig"
            [ -f "$sig" ] || { echo "WARNING: $2 has no .sig — $1 left out of latest.json"; return 0; }
            jq --arg k "$1" --arg u "$base/$(basename "$2")" --rawfile s "$sig" \
              '.platforms[$k] = {signature: $s, url: $u}' latest.json > t && mv t latest.json
          }
          add linux-x86_64  "$(find dist -name '*.AppImage'   | head -1)"
          add windows-x86_64 "$(find dist -name '*setup.exe'  | head -1)"
          add darwin-aarch64 "$(find dist -name '*.app.tar.gz' | head -1)"  # macos-14 runners are arm64
          cat latest.json

      - name: Snapshot download counts before this build destroys them
        # GitHub stores download_count ON the asset object, and everything in
        # the step below destroys asset objects: `--clobber` replaces the
        # same-named ones, and the sweep at the end deletes the previous
        # version's outright, because their filenames carry the version. So
        # every counter on this release is about to reset to zero.
        #
        # That happened 67 times between 2026-08-05 and 2026-08-24, which is
        # why the API reported 51 lifetime downloads for a beta that had 1,177
        # unique release-page visitors in the preceding fortnight. GitHub keeps
        # nothing about a deleted asset, so this is the last moment those
        # numbers exist anywhere. TinkerAtlas keeps the history from here on.
        #
        # continue-on-error, and no `set -e`: losing a data point is bad,
        # failing a release publish because a stats endpoint was down is worse.
        continue-on-error: true
        shell: bash
        env:
          RELEASE_STATS_URL: ${{ vars.RELEASE_STATS_URL }}
          RELEASE_STATS_SECRET: ${{ secrets.RELEASE_STATS_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${RELEASE_STATS_URL:-}" ] || [ -z "${RELEASE_STATS_SECRET:-}" ]; then
            echo "NOTE: RELEASE_STATS_URL or RELEASE_STATS_SECRET unset — skipping snapshot"
            exit 0
          fi

          R='${{ github.repository }}'
          if ! gh api "repos/$R/releases/tags/beta" > release.json 2>/dev/null; then
            echo "NOTE: no beta release yet — nothing to snapshot"
            exit 0
          fi

          jq -c --arg repo "$R" '{
            repo: $repo,
            release_tag: "beta",
            assets: [.assets[] | {id, name, download_count, created_at}]
          }' release.json > payload.json

          printf 'Snapshotting %s assets, %s downloads\n' \
            "$(jq '.assets | length' payload.json)" \
            "$(jq '[.assets[].download_count] | add // 0' payload.json)"

          # Signed with python, not `openssl dgst -hmac "$SECRET"`: openssl takes
          # the key as an argv element, which is readable from /proc by anything
          # else on the runner.
          sig=$(python3 -c '
          import hashlib, hmac, os, sys
          key = os.environ["RELEASE_STATS_SECRET"].encode()
          body = open("payload.json", "rb").read()
          sys.stdout.write("sha256=" + hmac.new(key, body, hashlib.sha256).hexdigest())
          ')

          # --data-binary, never -d: -d strips newlines, and jq -c emits a
          # trailing one. The signature covers the exact bytes on disk, so any
          # rewriting between signing and sending fails verification.
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 5 \
            -X POST "$RELEASE_STATS_URL" \
            -H 'Content-Type: application/json' \
            -H "x-signature-256: $sig" \
            --data-binary @payload.json) || code=000

          if [ "$code" = "200" ]; then
            echo "Snapshot recorded: $(cat response.txt)"
          else
            echo "WARNING: snapshot POST returned $code — this build's download counts are lost."
            cat response.txt 2>/dev/null || true
          fi

      - name: Publish rolling beta release
        shell: bash
        run: |
          set -euo pipefail
          # No spaces in Tauri bundle filenames, so plain word-splitting is safe here.
          files=$(find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*setup.exe' \
            -o -name '*.app.tar.gz' -o -name '*.sig' \))
          # Deliberately NOT `gh release delete ... --cleanup-tag` first. That left a
          # window with no release at all — and since the delete came BEFORE the
          # asset upload, the window was however long ~2GB takes to push, during
          # which downloads 404 and the updater has no latest.json to read. If the
          # create then failed the release simply stayed gone, which happened for
          # real on 2026-08-05. Everything below updates in place instead, so a
          # release always exists and a retry repairs rather than destroys.

          # Release notes: boilerplate, plus a section of CHANGELOG.md (every line
          # after a "## " heading, up to the next one). "### " subheads survive
          # because the pattern requires a space in the third column.
          #
          # Normally that is section 1, the open "## Unreleased". When it is EMPTY
          # we fall back to section 2, the newest named version. That case is a
          # release that was just cut: the cut is its own commit, so the build
          # carrying it would otherwise find nothing to say and replace a release
          # that HAD notes with one that has none, on a tag that is deleted and
          # recreated every build. The heading below stays generic either way, so
          # the notes never claim a version number the binary does not carry.
          printf 'Rolling beta 0.1.%s, rebuilt automatically from the latest `main` (commit %s).\n' \
            '${{ github.run_number }}' '${{ github.sha }}' > notes.md
          if [ -f CHANGELOG.md ]; then
            section() { awk -v want="$1" '/^## /{n++} n==want && !/^## /' CHANGELOG.md | sed -e '/./,$!d'; }
            section 1 > changes.md
            if [ ! -s changes.md ]; then
              echo "NOTE: Unreleased is empty (a release was just cut) — using the newest named section"
              section 2 > changes.md
            fi
            if [ -s changes.md ]; then
              printf '\n## Changes in this build\n\n' >> notes.md
              cat changes.md >> notes.md
            fi
          else
            echo "WARNING: no CHANGELOG.md, publishing boilerplate notes only"
          fi
          printf '\n---\n\nThe builds are unsigned for now: Windows shows a SmartScreen warning ("More info", then "Run anyway"); on macOS Gatekeeper may report the app as damaged, which it is not, and `xattr -dr com.apple.quarantine /Applications/SindriCAD.app` clears it. Install notes are in the [README](https://github.com/%s#install). Installed apps update themselves from this release.\n' \
            '${{ github.repository }}' >> notes.md
          cat notes.md

          R='${{ github.repository }}'
          SHA='${{ github.sha }}'

          # Move the rolling tag onto this commit (create it if it is missing).
          # Moving beats delete+recreate: the tag never stops existing, so the
          # release attached to it never does either.
          gh api -X PATCH "repos/$R/git/refs/tags/beta" -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$R/git/refs" -f ref=refs/tags/beta -f sha="$SHA"

          # Create only when there is nothing there; otherwise refresh the notes.
          if gh release view beta --repo "$R" >/dev/null 2>&1; then
            gh release edit beta --repo "$R" --prerelease \
              --title "SindriCAD beta (rolling)" --notes-file notes.md
          else
            gh release create beta --repo "$R" --prerelease \
              --title "SindriCAD beta (rolling)" --notes-file notes.md
          fi

          # Binaries first, latest.json LAST. Ordering is the whole point: the
          # previous build's assets stay live while these upload, so the manifest
          # on the release always names files that exist. It only starts pointing
          # at this build once every binary of this build is up.
          gh release upload beta --repo "$R" --clobber $files
          gh release upload beta --repo "$R" --clobber latest.json

          # Only now retire assets from older builds. Their filenames carry the
          # version, so they do not get clobbered by name and would otherwise pile
          # up forever. Failing here leaves extra files, which is harmless next to
          # leaving none.
          keep=$(for f in $files latest.json; do basename "$f"; done | sort -u)
          gh release view beta --repo "$R" --json assets -q '.assets[].name' \
            | while read -r asset; do
                printf '%s\n' "$keep" | grep -qxF "$asset" \
                  || gh release delete-asset beta "$asset" --repo "$R" --yes || true
              done

  # docs/IMPROVEMENT-AUDIT.md §5.4: the opt-in `rust-geom` feature (src-tauri/src/geom.rs,
  # 2320 lines / 67 unwrap-or-expect calls) is never compiled by the `build` job above
  # (default build is OCCT-free by design — see the Cargo.toml comment on the feature),
  # so it can silently bit-rot. This job is a manual, non-gating bit-rot check: it does
  # NOT run on push/PR and nothing `needs:` it.
  #
  # ubuntu-22.04's package repos top out around OCCT 7.6, but opencascade-sys (the
  # vendored third_party/opencascade-rs fork) requires OCCT >= 7.9, which isn't
  # available as a hosted-runner apt package — so this step is EXPECTED TO FAIL on
  # today's runners until either a newer runner image ships OCCT >= 7.9, or a step is
  # added here to build OCCT >= 7.9 from source (slow; deliberately not done today).
  # Trigger to revisit: when a runner image with OCCT 7.9 exists, or when rust-geom
  # gets promoted off the experimental-spike path.
  # Browser end-to-end checks for the imported-assembly Browser tree.
  #
  # GATES THE RELEASE (`release` needs it). It used to be deliberately
  # non-gating, on the reasoning that browser e2e is the classic flaky surface
  # and a flake must never block a beta publish. That reasoning cost more than it
  # saved: 8dc2f87 went red here with a real load-time crash (a `setStatus` call
  # during module evaluation hitting the temporal dead zone of a `let` declared
  # 700 lines further down), `build` was green, and the rolling beta published
  # anyway. A red e2e is now assumed real until someone looks at it. If a genuine
  # flake ever does block a publish, re-run the job — do not un-gate it again.
  #
  # These exist because everything else about the assembly tree is unit tests and
  # row counts. The render-signature bug (a document whose product NAMES changed
  # while its bodies did not never repainted the panel) passed every unit test and
  # was only caught by looking at the rendered panel.
  #
  # Uses the runner's PREINSTALLED Google Chrome rather than downloading a browser,
  # and installs playwright-core with --no-save so the main build path keeps its
  # dependency set unchanged.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: |
          npm ci
          npm i --no-save playwright-core@1.56.0

      - name: Install Python 3.12 + sync sidecar deps (locked)
        run: |
          uv python install 3.12
          cd sidecar && uv sync

      - name: Start the geometry sidecar and vite
        run: |
          cd sidecar && SINDRI_SIDECAR_PORT=8765 SINDRI_SIDECAR_TOKEN=citoken \
            uv run python server.py > /tmp/ci_sidecar.log 2>&1 &
          cd "$GITHUB_WORKSPACE" && npx vite --port 5173 > /tmp/ci_vite.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "LISTENING 8765" /tmp/ci_sidecar.log 2>/dev/null && break
            sleep 2
          done
          grep -q "LISTENING 8765" /tmp/ci_sidecar.log || { echo "sidecar never listened"; cat /tmp/ci_sidecar.log; exit 1; }

      # e2e/browser_tree_perf.cjs is deliberately NOT run here: it is a
      # benchmark whose verdict compares two medians, and a shared runner's
      # noise can invert that. Run it by hand (see its header).
      - name: Assembly tree end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/assembly_tree_e2e.cjs

      - name: Press/Pull dispatch end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/presspull_dispatch_e2e.cjs

      # GH #52 in the real app, and the only place the whole chain is exercised:
      # a face pick through real pointer events, the anchor it stores, the plane
      # the sidecar re-derives, and the snapshotFeature re-bake that silently
      # reverts the follow when the sketch is reopened. Every layer of that is
      # unit-tested separately and each layer passes while the feature is broken,
      # so this file is the only oracle for the seam.
      - name: Sketch-on-face end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/sketch_on_face_e2e.cjs

      # Field report 9ee3fb35. The unit test pins the selection function; this is
      # the only oracle for the seam — that the repaint actually re-runs when the
      # marker moves, and that its output reaches viewport.datumQuads, the array
      # the pick raycasts. It asserts on the built model too, so a run where the
      # rebuild did not follow the marker cannot pass by accident.
      - name: Rollback hides the datum plane end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/rollback_datum_e2e.cjs
      # Field report d1515ecd, and the only place its seam is real: a dimension
      # badge on a shape centred on the origin. Chromium fires no `dblclick`
      # once a pointerdown handler detaches the pressed element, and
      # `PointerEvent.detail` is 0 on pointerdown — both are browser facts a
      # unit test cannot show, and both are what made the badge uneditable.
      - name: Centred-rectangle dimension badge end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/centre_rect_dim_e2e.cjs
      # Field reports dff87040 and d8c5265e, one design gap: a badge's border is
      # the only signal of whether it drives anything. The pure decisions and the
      # solver behaviour are unit tested; what only exists in a running app is
      # the chain between them — a real contextmenu on a real badge, the menu
      # SketchMode builds from it, and the solve a real value edit kicks off.
      - name: Lock a dimension / who moves on a value edit, end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/lock_dimension_e2e.cjs
      # Field report f45fe95c: a construction plane drawn as a hardcoded 80x80
      # quad ends mid-body on any part wider than that, and its boundary slides
      # across the face while orbiting — "lines overlaying the surface of the
      # body … they moved as I rotated it". Nothing but a rendered frame can see
      # it: the quad geometry is valid at every size, and whether its edge lands
      # on the solid depends on the camera. The file carries its own RED control.
      - name: Construction-plane quad end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/datum_plane_quad_e2e.cjs
      # Getting OUT of a sketch: Finish on one nobody drew in must add nothing,
      # and Cancel Sketch must leave without committing. The store side is unit
      # tested, but the row in the Browser — the thing the two reporters had to
      # tick, select and delete — only exists in a running app.
      - name: Sketch exit end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/sketch_exit_e2e.cjs
      # Field report a0a76571, both halves of it that are about what the app
      # FAILS TO SAY: a chamfer the kernel refuses, and Ctrl+Z with the caret in
      # the tool's dimension box. Neither is reachable from a unit test — one
      # needs a real sidecar refusal arriving while a preview is live, the other
      # needs a real focused <input> in a real WebView.
      - name: Chamfer feedback end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/chamfer_feedback_e2e.cjs
      # Picking on a document with NO solid in it. The suppress-while-streaming
      # flag is only reachable through a real chunked reply, and the case that
      # broke it is a build whose mesh is EMPTY — neither is reproducible in a
      # unit test, which is why this ran green while the gesture was dead.
      - name: Profile pre-selection end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/region_preselect_e2e.cjs
      # Report ab855a5b, and only a real browser can answer it: sketch labels
      # painting and hit-testing over the panels is a question about stacking
      # and clipping, which every unit around it passes while it is broken.
      - name: Sketch label clipping end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/sketch_label_clip_e2e.cjs
      # The select tool's body drag, mid-gesture. Reports d0b008cb / c0bf7020 /
      # 41dc3246 are all observable only with the button STILL DOWN: release has
      # always re-solved, so every one of them looks fixed the instant you let go.
      - name: Sketch body-drag end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/sketch_body_drag_e2e.cjs

      # No SC_TOKEN: this one never reaches the sidecar. It breaks getContext
      # before the page loads and asserts on what the user is left looking at,
      # which happens during module evaluation, long before geometry connects.
      - name: No-WebGL fallback end-to-end
        env:
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/webgl_fallback_e2e.cjs

      # Also no SC_TOKEN: the bug reporter is built to work with the geometry
      # engine dead, which is its whole point. The thing under test is the
      # browser's own click retargeting — a drag out of the card reports its
      # click on the backdrop — so only a real engine can see it.
      - name: Bug dialog backdrop end-to-end
        env:
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/bug_dialog_backdrop_e2e.cjs
      # Also no SC_TOKEN: it takes the GL context away with WEBGL_lose_context
      # and asks what the user is left with. Needs a real compositor to read the
      # colour back out of a screenshot, so it can only live here.
      - name: WebGL context-loss recovery end-to-end
        env:
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/webgl_context_loss_e2e.cjs
      # Two Windows 11 reports about menu layout. No SC_TOKEN either: the
      # menubar is built during module evaluation. It measures wrapped rows and
      # the dead margin beside the widest row, which needs a real layout engine —
      # there is no jsdom here, and jsdom would not lay anything out anyway.
      - name: Menu layout end-to-end
        env:
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/menu_layout_e2e.cjs

      - name: Sidecar log on failure
        if: failure()
        run: tail -50 /tmp/ci_sidecar.log /tmp/ci_vite.log || true

  rust-geom-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check --features rust-geom (expected to fail without OCCT >= 7.9)
        working-directory: src-tauri
        run: cargo check --features rust-geom
