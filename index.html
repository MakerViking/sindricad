<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SindriCAD</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <span class="brand"><img src="assets/brand/sindricad-lockup-app.svg" alt="SindriCAD" /></span>
        <nav id="menubar"></nav>
        <button id="undo-btn" class="tb-btn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5h11a5 5 0 0 1 0 10H9"/><path d="M8.5 6.5l-4 4 4 4"/></svg></button>
        <button id="redo-btn" class="tb-btn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 10.5h-11a5 5 0 0 0 0 10H15"/><path d="M15.5 6.5l4 4-4 4"/></svg></button>
        <span id="context-tab" class="context-tab">SOLID</span>
        <span id="docname" class="docname">Untitled</span>
        <div class="spacer"></div>
        <label class="units" title="Display units (geometry is stored in mm)">
          Units
          <select id="unit">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="in">in</option>
          </select>
        </label>
        <span id="status" class="status">connecting…</span>
      </header>
      <div id="ribbon"></div>
      <div id="main">
        <aside id="browser"></aside>
        <div id="viewport">
          <canvas id="canvas"></canvas>
          <aside id="palette" class="palette hidden"></aside>
          <div id="prompt" class="prompt hidden"></div>
          <div id="viewcontrols">
            <button data-view="iso" title="Isometric">ISO</button>
            <button data-view="top" title="Top">Top</button>
            <button data-view="front" title="Front">Front</button>
            <button data-view="right" title="Right">Right</button>
            <button id="fit" title="Fit to view">Fit</button>
            <button id="proj" title="Projection: Persp / Ortho / Auto (ortho when viewing straight-on)">Auto</button>
            <button id="selmode" title="Toggle selecting Faces / whole Bodies">Faces</button>
          </div>
          <div id="fps" class="fps">idle</div>
        </div>
        <aside id="inspector"></aside>
      </div>
      <footer id="timeline"></footer>
    </div>
    <!-- Before main.ts on purpose: boot.ts reports to Rust that the page
         loaded, and must not be able to fail because main.ts did. -->
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
